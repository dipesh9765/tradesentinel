[project]
name = "tradesentinel-backend"
version = "1.0.0"
requires-python = ">=3.11"

[tool.ruff]
line-length = 110
target-version = "py311"
extend-exclude = ["venv", "dist", "build"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = [
    "E501",    # long lines are formatted by ruff format
    "B008",    # FastAPI Depends() in defaults is idiomatic
    "RUF012",  # mutable class attrs on plain classes
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]
# StrEnum would change str() output; keep (str, Enum) to preserve serialized values.
"app/core/interfaces.py" = ["UP042"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
source = ["."]
omit = ["venv/*", "tests/*"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true
exclude = ["venv/", "tests/"]
